<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додавання і віднімання дробів з різними знаменниками | Математичний Хаб</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--text-primary);
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        /* Екран ідентифікації учня */
        #auth-screen {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            max-width: 500px;
            margin: 3rem auto;
            text-align: center;
        }

        #auth-screen h2 {
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
        }

        #auth-screen p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }

        /* Екран тесту */
        #test-screen {
            display: none;
        }

        .test-header {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .student-info-badge {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .task-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .task-number {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .task-condition {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-label input {
            accent-color: var(--accent-blue);
        }

        /* Екран результатів */
        #results-screen {
            display: none;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .results-score {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-green);
            margin: 1rem 0;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="rational-fractions-folder.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-arrow-left"></i></div>
                <span>Назад до папки матеріалів</span>
            </a>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">8 клас • Алгебра</div>
        </div>
    </header>

    <main>
        <!-- ЕКРАН АВТОРИЗАЦІЇ -->
        <div id="auth-screen">
            <h2>Ідентифікація учня</h2>
            <p>Будь ласка, введіть свої дані перед початком виконання тренажера</p>
            <div class="form-group">
                <label for="surname">Прізвище:</label>
                <input type="text" id="surname" class="form-control" placeholder="Наприклад, Шевченко" required>
            </div>
            <div class="form-group">
                <label for="name">Ім'я:</label>
                <input type="text" id="name" class="form-control" placeholder="Наприклад, Олена" required>
            </div>
            <div class="form-group">
                <label for="student-class">Клас:</label>
                <input type="text" id="student-class" class="form-control" placeholder="Наприклад, 8-А" required>
            </div>
            <button class="btn" onclick="startTest()">Розпочати виконання</button>
        </div>

        <!-- ЕКРАН ТЕСТУ -->
        <div id="test-screen">
            <div class="test-header">
                <div class="student-info-badge" id="display-student">Учень: </div>
                <div style="font-size: 0.85rem; color: var(--text-secondary);">Тема: Додавання і віднімання дробів з різними знаменниками</div>
            </div>

            <div id="tasks-container">
                <!-- Завдання генеруються динамічно або виводяться фіксовано -->
            </div>

            <button class="btn" onclick="submitTest()" style="margin-top: 1.5rem;">Завершити і перевірити</button>
        </div>

        <!-- ЕКРАН РЕЗУЛЬТАТІВ -->
        <div id="results-screen">
            <h2>Результати тестування</h2>
            <div id="result-details" style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 1rem;"></div>
            <div class="results-score" id="score-display">0 / 5</div>
            <p id="feedback-text" style="margin-bottom: 1.5rem; font-weight: 500;"></p>
            <button class="btn" onclick="location.reload()">Пройти знову</button>
        </div>
    </main>

    <footer>
        <p>© 2026 Математичний Хаб. Усі права захищено.</p>
    </footer>

    <script>
        const tasks = [
            {
                id: 1,
                condition: "Виконайте додавання: \\(\\frac{1}{x} + \\frac{1}{2x}\\)",
                text: "Виконайте додавання: 1/x + 1/(2x)",
                options: [
                    "\\(\\frac{2}{3x}\\)",
                    "\\(\\frac{3}{2x}\\)",
                    "\\(\\frac{2}{x}\\)",
                    "\\(\\frac{3}{3x}\\)"
                ],
                rawOptions: ["2/(3x)", "3/(2x)", "2/x", "3/(3x)"],
                correct: 1 // друга опція (індекс 1) -> 3/(2x)
            },
            {
                id: 2,
                condition: "Знайдіть різницю: \\(\\frac{3}{a} - \\frac{2}{b}\\)",
                text: "Знайдіть різницю: 3/a - 2/b",
                options: [
                    "\\(\\frac{1}{a-b}\\)",
                    "\\(\\frac{3b - 2a}{ab}\\)",
                    "\\(\\frac{3a - 2b}{ab}\\)",
                    "\\(\\frac{1}{ab}\\)"
                ],
                rawOptions: ["1/(a-b)", "(3b - 2a)/(ab)", "(3a - 2b)/(ab)", "1/(ab)"],
                correct: 1
            },
            {
                id: 3,
                condition: "Спростіть вираз: \\(\\frac{x}{x-2} - \\frac{2}{x}\\)",
                text: "Спростіть вираз: x / (x - 2) - 2 / x",
                options: [
                    "\\(\\frac{x-4}{x(x-2)}\\)",
                    "\\(\\frac{x^2 - 2x + 4}{x(x-2)}\\)",
                    "\\(\\frac{4}{x(x-2)}\\)",
                    "\\(\\frac{x-2}{x}\\)"
                ],
                rawOptions: ["(x-4)/(x(x-2))", "(x^2 - 2x + 4)/(x(x-2))", "4/(x(x-2))", "(x-2)/x"],
                correct: 0
            },
            {
                id: 4,
                condition: "Виконайте дії: \\(\\frac{5}{x-3} + \\frac{3}{3-x}\\)",
                text: "Виконайте дії: 5 / (x - 3) + 3 / (3 - x)",
                options: [
                    "\\(\\frac{2}{x-3}\\)",
                    "\\(\\frac{8}{x-3}\\)",
                    "\\(\\frac{2}{3-x}\\)",
                    "\\(\\frac{8}{3-x}\\)"
                ],
                rawOptions: ["2/(x-3)", "8/(x-3)", "2/(3-x)", "8/(3-x)"],
                correct: 0
            },
            {
                id: 5,
                condition: "Зведіть до спільного знаменника та спростіть: \\(\\frac{1}{x+1} + \\frac{1}{x-1}\\)",
                text: "Зведіть до спільного знаменника та спростіть: 1/(x+1) + 1/(x-1)",
                options: [
                    "\\(\\frac{2}{x^2-1}\\)",
                    "\\(\\frac{2x}{x^2-1}\\)",
                    "\\(\\frac{1}{x^2-1}\\)",
                    "\\(\\frac{2x}{x-1}\\)"
                ],
                rawOptions: ["2/(x^2-1)", "2x/(x^2-1)", "1/(x^2-1)", "2x/(x-1)"],
                correct: 1
            }
        ];

        let studentData = { surname: '', name: '', class: '' };

        function startTest() {
            const surname = document.getElementById('surname').value.trim();
            const name = document.getElementById('name').value.trim();
            const studentClass = document.getElementById('student-class').value.trim();

            if (!surname || !name || !studentClass) {
                alert('Будь ласка, заповніть усі поля ідентифікації (Прізвище, Ім\'я, Клас)!');
                return;
            }

            studentData = { surname, name, class: studentClass };
            document.getElementById('display-student').innerText = `Учень: ${surname} ${name} (${studentClass} клас)`;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('test-screen').style.display = 'block';

            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            let html = '';

            tasks.forEach((task, index) => {
                html += `
                    <div class="task-card">
                        <div class="task-number">Завдання ${index + 1}</div>
                        <div class="task-condition">${task.text}</div>
                        <div class="options-list">
                `;

                task.rawOptions.forEach((opt, optIndex) => {
                    html += `
                        <label class="option-label">
                            <input type="radio" name="task_${index}" value="${optIndex}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function submitTest() {
            let score = 0;
            let answeredCount = 0;

            tasks.forEach((task, index) => {
                const selected = document.querySelector(`input[name="task_${index}"]:checked`);
                if (selected) {
                    answeredCount++;
                    if (parseInt(selected.value) === task.correct) {
                        score++;
                    }
                }
            });

            if (answeredCount < tasks.length) {
                if (!confirm(`Ви відповіли не на всі запитання (${answeredCount} з ${tasks.length}). Бажаєте завершити тест?`)) {
                    return;
                }
            }

            document.getElementById('test-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';

            document.getElementById('result-details').innerText = `${studentData.surname} ${studentData.name}, ${studentData.class} клас`;
            document.getElementById('score-display').innerText = `${score} / ${tasks.length}`;

            let feedback = '';
            if (score === tasks.length) {
                feedback = 'Чудово! Ви чудово засвоїли тему!';
            } else if (score >= 3) {
                feedback = 'Добре, але є над чим попрацювати.';
            } else {
                feedback = 'Слід повторити правила зведення до спільного знаменника.';
            }
            document.getElementById('feedback-text').innerText = feedback;
        }
    </script>
</body>
</html>
