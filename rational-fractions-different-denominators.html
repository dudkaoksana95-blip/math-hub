<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додавання і віднімання дробів з різними знаменниками</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding: 2rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary); }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
        .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; }
        .form-control:focus { border-color: var(--accent-blue); }
        .btn { background: var(--accent-blue); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; }
        .btn:hover { background: #2563eb; }
        #test-screen, #results-screen { display: none; }
        .task-block { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
        .task-title { font-weight: 600; margin-bottom: 0.75rem; }
        .options label { display: block; padding: 0.5rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; }
        .options label:hover { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЕКРАН ІДЕНТИФІКАЦІЇ -->
    <div id="auth-screen" class="card" style="text-align: center;">
        <h2>Ідентифікація учня</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">Введіть свої дані для проходження тренажера</p>
        <div class="form-group">
            <label>Прізвище:</label>
            <input type="text" id="surname" class="form-control" placeholder="Шевченко">
        </div>
        <div class="form-group">
            <label>Ім'я:</label>
            <input type="text" id="name" class="form-control" placeholder="Олена">
        </div>
        <div class="form-group">
            <label>Клас:</label>
            <input type="text" id="student-class" class="form-control" placeholder="8-А">
        </div>
        <button class="btn" onclick="startTest()">Розпочати тест</button>
    </div>

    <!-- ЕКРАН ТЕСТУ -->
    <div id="test-screen" class="card">
        <div id="student-badge" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; font-weight: 600;"></div>
        <h2>Додавання і віднімання дробів з різними знаменниками</h2>
        
        <div class="task-block">
            <div class="task-title">1. Виконайте додавання: \(\frac{1}{x} + \frac{1}{2x}\)</div>
            <div class="options">
                <label><input type="radio" name="q1" value="0"> \(\frac{2}{3x}\)</label>
                <label><input type="radio" name="q1" value="1"> \(\frac{3}{2x}\)</label>
                <label><input type="radio" name="q1" value="2"> \(\frac{2}{x}\)</label>
            </div>
        </div>

        <div class="task-block">
            <div class="task-title">2. Знайдіть різницю: \(\frac{3}{a} - \frac{2}{b}\)</div>
            <div class="options">
                <label><input type="radio" name="q2" value="0"> \(\frac{1}{a-b}\)</label>
                <label><input type="radio" name="q2" value="1"> \(\frac{3b - 2a}{ab}\)</label>
                <label><input type="radio" name="q2" value="2"> \(\frac{1}{ab}\)</label>
            </div>
        </div>

        <button class="btn" onclick="submitTest()">Завершити тест</button>
    </div>

    <!-- ЕКРАН РЕЗУЛЬТАТУ -->
    <div id="results-screen" class="card" style="text-align: center;">
        <h2>Результати тестування</h2>
        <p id="result-text" style="font-size: 1.1rem; margin: 1rem 0;"></p>
        <button class="btn" onclick="location.reload()">Пройти знову</button>
    </div>
</div>

<script>
    let userData = {};

    function startTest() {
        const surname = document.getElementById('surname').value.trim();
        const name = document.getElementById('name').value.trim();
        const sClass = document.getElementById('student-class').value.trim();

        if (!surname || !name || !sClass) {
            alert('Будь ласка, заповніть усі поля!');
            return;
        }

        userData = { surname, name, sClass };
        document.getElementById('student-badge').innerText = `Учень: ${surname} ${name} (${sClass} клас)`;
        
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('test-screen').style.display = 'block';
    }

    function submitTest() {
        let score = 0;
        const q1 = document.querySelector('input[name="q1"]:checked');
        const q2 = document.querySelector('input[name="q2"]:checked');

        if (q1 && q1.value === "1") score++;
        if (q2 && q2.value === "1") score++;

        document.getElementById('test-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        
        document.getElementById('result-text').innerHTML = `
            <b>${userData.surname} ${userData.name} (${userData.sClass})</b><br>
            Ваш результат: <b>${score} / 2</b>
        `;
    }
</script>

</body>
</html>
