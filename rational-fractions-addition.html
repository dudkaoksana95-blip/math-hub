<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додавання і віднімання дробів з різними знаменниками | Математичний Хаб</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Підключення MathJax для якісних математичних формул -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-green: #22c55e;
            --accent-green-light: #f0fdf4;
            --accent-blue: #3b82f6;
            --danger-color: #ef4444;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--text-primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        main {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .test-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
        }

        .card-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
        }

        .badge-grade { background: #e0f2fe; color: #0369a1; }
        .badge-algebra { background: #fef3c7; color: #b45309; }

        .test-header-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: #f1f5f9;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .timer {
            color: var(--danger-color);
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            background: #f8fafc;
        }

        .question-block {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 10px;
        }

        .action-btn {
            background: var(--text-primary);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            margin: 2rem auto 0 auto;
        }

        .action-btn:hover {
            background: #334155;
        }

        #result-section {
            display: none;
            margin-top: 2rem;
        }

        .results-score {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-green);
            text-align: center;
            margin: 1rem 0;
        }

        .recommendations {
            padding: 1.5rem;
            background: #eff6ff;
            border-left: 4px solid var(--accent-blue);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: auto;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
                <span>Математичний Хаб</span>
            </a>
            <div style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500;">
                Дудка Оксана Анатоліївна
            </div>
        </div>
    </header>

    <main>
        <div class="test-card">
            <div class="card-badges">
                <span class="badge badge-grade">8 клас</span>
                <span class="badge badge-algebra">Алгебра</span>
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Додавання і віднімання дробів з різними знаменниками</h1>

            <div class="input-group">
                <label for="student-name">Прізвище та Ім'я учня:</label>
                <input type="text" id="student-name" placeholder="наприклад, Шевченко Іван" autocomplete="off">
            </div>

            <div class="test-header-bar">
                <div class="timer" id="timer-display">Час: 30:00</div>
            </div>

            <div id="questions-container"></div>

            <button class="action-btn" id="finish-btn" onclick="finishTest()">Завершити тестування і переглянути результат</button>

            <div id="result-section">
                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 2rem 0;">
                <h2 style="text-align: center; margin-bottom: 0.5rem;">Результати тестування</h2>
                <p style="text-align: center; color: var(--text-secondary);" id="protocol-student-info"></p>
                
                <div class="results-score" id="score-display">0 / 12</div>

                <div class="recommendations" id="recommendations-box"></div>

                <button class="action-btn" onclick="location.reload()" style="margin-top: 2rem;">
                    <i class="fa-solid fa-rotate-right"></i> Пройти знову
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Математичний Хаб. Авторські матеріали з математики.</p>
    </footer>

    <script>
        let timer;
        let timeLeft = 30 * 60;
        let currentQuestions = [];
        let userAnswers = {};
        let isFinished = false;

        function generateQuestions() {
            currentQuestions = [
                {
                    id: 1,
                    text: "Виконайте дію: $$\\frac{1}{a^2} + \\frac{a - 2}{a}$$",
                    correct: "$$\\frac{a^2 - 2a + 1}{a^2}$$",
                    options: [
                        "$$\\frac{a^2 - 2a + 1}{a^2}$$",
                        "$$\\frac{a - 1}{a^2}$$",
                        "$$\\frac{a^2 + a - 2}{a^2}$$",
                        "$$\\frac{a - 2}{a^2}$$"
                    ]
                },
                {
                    id: 2,
                    text: "Виконайте дію: $$\\frac{2 + m}{m^2} - \\frac{m^2 - 5}{m^3}$$",
                    correct: "$$\\frac{m + 5}{m^3}$$",
                    options: [
                        "$$\\frac{m + 5}{m^3}$$",
                        "$$\\frac{2m - m^2 + 5}{m^3}$$",
                        "$$\\frac{5}{m^3}$$",
                        "$$\\frac{2m + 5}{m^3}$$"
                    ]
                },
                {
                    id: 3,
                    text: "Спростіть вираз: $$\\frac{m + 2}{m^2} - \\frac{1}{m}$$",
                    correct: "$$\\frac{2}{m^2}$$",
                    options: [
                        "$$\\frac{2}{m^2}$$",
                        "$$\\frac{m + 1}{m^2}$$",
                        "$$\\frac{2 - m}{m^2}$$",
                        "$$\\frac{1}{m^2}$$"
                    ]
                },
                {
                    id: 4,
                    text: "Виконайте дію: $$\\frac{4}{b} + \\frac{7}{b + 2}$$",
                    correct: "$$\\frac{11b + 8}{b(b + 2)}$$",
                    options: [
                        "$$\\frac{11b + 8}{b(b + 2)}$$",
                        "$$\\frac{11}{b(b + 2)}$$",
                        "$$\\frac{4b + 7}{b(b + 2)}$$",
                        "$$\\frac{11b - 8}{b(b + 2)}$$"
                    ]
                },
                {
                    id: 5,
                    text: "Виконайте дію: $$\\frac{3}{m - n} - \\frac{2}{m + n}$$",
                    correct: "$$\\frac{m + 5n}{m^2 - n^2}$$",
                    options: [
                        "$$\\frac{m + 5n}{m^2 - n^2}$$",
                        "$$\\frac{m - n}{m^2 - n^2}$$",
                        "$$\\frac{5m + n}{m^2 - n^2}$$",
                        "$$\\frac{1}{m^2 - n^2}$$"
                    ]
                },
                {
                    id: 6,
                    text: "Виконайте дію: $$\\frac{a - 2}{2(a + 1)} + \\frac{a}{a + 1}$$",
                    correct: "$$\\frac{3a - 2}{2(a + 1)}$$",
                    options: [
                        "$$\\frac{3a - 2}{2(a + 1)}$$",
                        "$$\\frac{2a - 2}{2(a + 1)}$$",
                        "$$\\frac{3a + 2}{2(a + 1)}$$",
                        "$$\\frac{a - 2}{2(a + 1)}$$"
                    ]
                },
                {
                    id: 7,
                    text: "Спростіть вираз: $$\\frac{2}{a} + \\frac{3}{a - 1}$$",
                    correct: "$$\\frac{5a - 2}{a(a - 1)}$$",
                    options: [
                        "$$\\frac{5a - 2}{a(a - 1)}$$",
                        "$$\\frac{5a + 2}{a(a - 1)}$$",
                        "$$\\frac{5}{a(a - 1)}$$",
                        "$$\\frac{a - 2}{a(a - 1)}$$"
                    ]
                },
                {
                    id: 8,
                    text: "Виконайте дію: $$\\frac{x - y}{x^2} - \\frac{y - x}{xy}$$",
                    correct: "$$\\frac{x^2 - y^2}{x^2y}$$",
                    options: [
                        "$$\\frac{x^2 - y^2}{x^2y}$$",
                        "$$\\frac{x - y}{x^2y}$$",
                        "$$\\frac{x^2 + y^2}{x^2y}$$",
                        "$$\\frac{2x^2 - y^2}{x^2y}$$"
                    ]
                },
                {
                    id: 9,
                    text: "Спростіть вираз: $$\\frac{4}{a^2 - 9} - \\frac{2}{a^2 + 3a}$$",
                    correct: "$$\\frac{2}{a(a - 3)}$$",
                    options: [
                        "$$\\frac{2}{a(a - 3)}$$",
                        "$$\\frac{2}{a(a + 3)}$$",
                        "$$\\frac{6}{a(a^2 - 9)}$$",
                        "$$\\frac{2a}{a^2 - 9}$$"
                    ]
                },
                {
                    id: 10,
                    text: "Виконайте дію: $$m - \\frac{3}{n}$$",
                    correct: "$$\\frac{mn - 3}{n}$$",
                    options: [
                        "$$\\frac{mn - 3}{n}$$",
                        "$$\\frac{m - 3}{n}$$",
                        "$$\\frac{m - 3n}{n}$$",
                        "$$m - 3n$$"
                    ]
                },
                {
                    id: 11,
                    text: "Спростіть вираз: $$1 - \\frac{m}{2} - \\frac{n}{3}$$",
                    correct: "$$\\frac{6 - 3m - 2n}{6}$$",
                    options: [
                        "$$\\frac{6 - 3m - 2n}{6}$$",
                        "$$\\frac{1 - m - n}{6}$$",
                        "$$\\frac{6 - m - n}{6}$$",
                        "$$\\frac{5 - 3m - 2n}{6}$$"
                    ]
                },
                {
                    id: 12,
                    text: "Спростіть вираз: $$\\frac{x - 1}{x^2 - x + 1} + \\frac{2 - x}{x^3 + 1}$$",
                    correct: "$$\\frac{1}{x + 1}$$",
                    options: [
                        "$$\\frac{1}{x + 1}$$",
                        "$$\\frac{1}{x - 1}$$",
                        "$$\\frac{x}{x + 1}$$",
                        "$$x + 1$$"
                    ]
                }
            ];
        }

        function renderQuestions() {
            const container = document.getElementById("questions-container");
            container.innerHTML = "";

            currentQuestions.forEach((q, index) => {
                let optionsHtml = "";
                q.options.forEach(opt => {
                    optionsHtml += `
                        <label class="option-label">
                            <input type="radio" name="q_${q.id}" value="${opt}" onchange="saveAnswer(${q.id}, '${opt}')">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="question-block" id="block_${q.id}">
                        <div class="question-title">Завдання ${index + 1} із ${currentQuestions.length}.</div>
                        <div>${q.text}</div>
                        <div class="options-list" style="margin-top: 10px;">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        function saveAnswer(qId, val) {
            userAnswers[qId] = val;
        }

        function startTimer() {
            timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!isFinished) finishTest();
                    return;
                }
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById("timer-display").innerText = 
                    `Час: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }, 1000);
        }

        function finishTest() {
            const nameInput = document.getElementById("student-name").value.trim();
            if (!nameInput) {
                alert("Будь ласка, введіть Прізвище та Ім'я учня перед завершенням тесту!");
                document.getElementById("student-name").focus();
                return;
            }

            isFinished = true;
            clearInterval(timer);

            let score = 0;

            currentQuestions.forEach((q) => {
                let userAns = userAnswers[q.id] || "";
                if (userAns === q.correct) {
                    score++;
                }
            });

            let recommendationsHtml = "<b>Рекомендації щодо повторення теми:</b><br>";
            if (score === 12) {
                recommendationsHtml += "✨ <b>Фантастичний результат!</b> Ви чудово опанували зведення раціональних дробів до спільного знаменника, перетворення цілих виразів у дроби та виконання дій з ними.";
            } else if (score >= 9) {
                recommendationsHtml += "👍 <b>Добрий результат!</b> Варто ще трохи зосередитися на уважності при знаходженні спільних знаменників та перевіці знаків під час розкриття дужок у чисельнику.";
            } else if (score >= 5) {
                recommendationsHtml += "⚠️ <b>Тема вимагає доопрацювання.</b> Рекомендуємо повторити правила знаходження найменшого спільного знаменника для алгебраїчних дробів, розкладання знаменників на множники та знаходження додаткових множників.";
            } else {
                recommendationsHtml += "📚 <b>Потрібно суттєво повторити тему.</b> Рекомендуємо детально переглянути параграф підручника щодо додавання і віднімання раціональних дробів з різними знаменниками, повторити формули скороченого множення та основну властивість дробу.";
            }

            document.getElementById("protocol-student-info").innerText = `Учень: ${nameInput} | Витрачено часу: ${Math.floor((30*60 - timeLeft)/60)} хв.`;
            document.getElementById("score-display").innerText = `${score} / ${currentQuestions.length}`;
            document.getElementById("recommendations-box").innerHTML = recommendationsHtml;

            document.getElementById("result-section").style.display = "block";
            document.getElementById("finish-btn").style.display = "none";
            
            document.getElementById("result-section").scrollIntoView({ behavior: 'smooth' });

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        generateQuestions();
        renderQuestions();
        startTimer();
    </script>

</body>
</html>
