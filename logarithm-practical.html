<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НМТ ТРЕНАЖЕР: Практичні логарифми</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .math { font-family: "Times New Roman", serif; font-style: italic; }
        #dog-track { position: relative; height: 60px; background: #e2e8f0; border-radius: 30px; overflow: hidden; }
        #dog-runner { 
            position: absolute; left: 0; transition: all 0.5s ease-out; 
            font-size: 40px; line-height: 60px;
        }
        .finish-line { position: absolute; right: 10px; font-weight: bold; color: #ef4444; line-height: 60px; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-blue-800 p-6 text-white text-center">
            <h1 class="text-3xl font-bold">🧪 Практико-орієнтовані задачі з логарифмами</h1>
            <p class="mt-2 opacity-90">НМТ-тренажер: фізика, хімія, біологія та фінанси у формулах</p>
        </div>

        <div id="start-screen" class="p-10 text-center">
            <label class="block text-lg mb-4 text-slate-700 font-medium">Введіть прізвище та ім'я учня:</label>
            <input type="text" id="user-name" class="border-2 border-blue-300 rounded-lg px-4 py-3 mb-6 w-72 text-center focus:outline-none focus:border-blue-600 text-lg" placeholder="Прізвище Ім'я">
            <button onclick="startQuiz()" class="block mx-auto bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-10 rounded-full transition shadow-md">Розпочати тест (20 хв)</button>
        </div>

        <div id="quiz-screen" class="hidden p-6">
            <div class="flex justify-between items-center mb-6 bg-slate-100 p-4 rounded-xl">
                <div>Учень: <span id="display-name" class="font-bold text-blue-700"></span></div>
                <div class="text-xl font-mono font-bold text-red-500">⏳ <span id="timer">20:00</span></div>
                <div class="font-bold text-slate-700">✅ Виконано: <span id="correct-count">0</span>/12</div>
            </div>

            <div class="mb-8">
                <p class="text-sm mb-1 text-slate-500 font-medium">Прогрес проходження (Джек Рассел поспішає до фінішу):</p>
                <div id="dog-track">
                    <div class="finish-line">🚩 ФІНІШ</div>
                    <div id="dog-runner">🐶</div>
                </div>
            </div>

            <div id="tasks-grid" class="grid grid-cols-1 gap-4 mb-8">
                <!-- Сюди динамічно завантажуються завдання -->
            </div>

            <button id="finish-btn" onclick="showFinalResults()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg">ГОТОВО (Переглянути протокол і поради)</button>
        </div>

        <div id="result-screen" class="hidden p-10 text-center">
            <h2 class="text-4xl font-bold mb-4 text-slate-800">Тест завершено!</h2>
            <div id="final-stats" class="text-xl mb-6 text-slate-700"></div>
            <div id="advice-box" class="bg-amber-50 p-6 rounded-2xl text-left border-l-8 border-amber-400 mb-8">
                <h3 class="font-bold text-lg mb-2 text-amber-900">💡 Поради та аналіз теми:</h3>
                <ul id="advice-list" class="list-disc ml-5 space-y-2 text-amber-900"></ul>
            </div>
            <button onclick="location.reload()" class="bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl hover:bg-blue-800 transition">Спробувати ще раз (інші варіанти)</button>
        </div>
    </div>

    <script>
        // База практичних задач
        const practicalPool = [
            { q: "<b>Фізика (Акустика):</b> Інтенсивність звуку на рок-концерті дорівнює 10<sup>-2</sup> Вт/м². Обчисліть рівень гучності в децибелах за формулою <i>L = 10 · lg(I / I<sub>0</sub>)</i>, де порогова інтенсивність <i>I<sub>0</sub> = 10<sup>-12</sup> Вт/м²</i>.", a: "100", exp: "L = 10 · lg(10<sup>-2</sup> / 10<sup>-12</sup>) = 10 · lg(10<sup>10</sup>) = 10 · 10 = 100 дБ." },
            { q: "<b>Хімія (Середовище розчину):</b> Визначте показник pH розчину кавового напою, якщо концентрація іонів водню становить [H<sup>+</sup>] = 10<sup>-5</sup> моль/л. Використайте формулу <i>pH = -lg[H<sup>+</sup>]</i>.", a: "5", exp: "pH = -lg(10<sup>-5</sup>) = -(-5) = 5 (слабкокисле середовище)." },
           { q: "<b>Фінанси (Банківський вклад):</b> Вкладник поклав на рахунок у банк 5000 грн під 20% річних (прості відсотки). Через скільки років сума нарахованих відсотків дорівнюватиме початковому внеску, якщо формула простих відсотків має вигляд <i>I = S<sub>0</sub> &middot; (p / 100) &middot; n</i>?", a: "5", exp: "Складіть рівняння: 5000 = 5000 &middot; (20 / 100) &middot; n &rArr; 1 = 0.2 &middot; n &rArr; n = 5." },
            { q: "<b>Біологія (Кінетика популяції):</b> Бактерії в живильному середовищі діляться так, що їх кількість зростає за законом <i>x = 2<sup>t</sup></i>, де <i>t</i> — час у годинах. Через скільки годин кількість бактерій досягне 32?", a: "5", exp: "2<sup>t</sup> = 32 => 2<sup>t</sup> = 2<sup>5</sup> => t = 5 годин." },
            { q: "<b>Астрономія (Шкала зіркових величин):</b> Різниця видимих блисків двох зірок визначається за формулою Погсона: <i>m<sub>1</sub> - m<sub>2</sub> = -2.5 lg(L<sub>1</sub> / L<sub>2</sub>)</i>. Якщо відношення світлових випромінювань <i>L<sub>1</sub> / L<sub>2</sub> = 100</i>, знайдіть різницю зіркових величин.", a: "-5", exp: "-2.5 · lg(100) = -2.5 · 2 = -5." },
           { q: "<b>Сейсмологія (Шкала Ріхтера):</b> Енергія землетрусу (у джоулях) пов'язана з магнітудою <i>M</i> співвідношенням <i>lg(E) = 4.4 + 1.5M</i>. Знайдіть показник степеня (значення <i>lg(E)</i>) для землетрусу з магнітудою <i>M = 2</i>.", a: "7.4", exp: "Підставте значення M = 2 у формулу: lg(E) = 4.4 + 1.5 &middot; 2 = 4.4 + 3.0 = 7.4." },
            { q: "<b>Хімія:</b> Розрахуйте концентрацію іонів водню [H<sup>+</sup>] (у моль/л) у соку з показником pH = 3. Використайте обернену формулу [H<sup>+</sup>] = 10<sup>-pH</sup>.", a: "0.001", exp: "[H<sup>+</sup>] = 10<sup>-3</sup> = 1/1000 = 0.001." },
            { q: "<b>Фізика:</b> Загасаючі коливання маятника описуються логарифмічним декрементом. Якщо амплітуда зменшилася у 10 разів, а логарифм відношення амплітуд дорівнює <i>ln(10)</i>, чому дорівнює десятковий логарифм цього ж відношення <i>lg(10)</i>?", a: "1", exp: "lg(10) = 1 за визначенням десяткового логарифма." },
            { q: "<b>Економіка:</b> Рівняння корисності споживача задано логарифмічною функцією корисності <i>U(x) = 5 + lg(x)</i>. Знайдіть обсяг споживання <i>x</i>, якщо корисність <i>U(x) = 8</i>.", a: "1000", exp: "5 + lg(x) = 8 => lg(x) = 3 => x = 10<sup>3</sup> = 1000." },
            { q: "<b>Радіоізотопне датування:</b> Кількість радіоактивного вуглецю зменшується за законом <i>m(t) = m<sub>0</sub> · 2<sup>-t/5730</sup></i>. Через скільки років маса зменшиться вдвічі (період напіврозпаду)?", a: "5730", exp: "За означенням періоду напіврозпаду це дорівнює 5730 рокам." },
            { q: "<b>Теорія інформації (Формула Хартлі):</b> Кількість інформації обчислюється за формулою <i>I = log<sub>2</sub>(N)</i>, де <i>N</i> — кількість рівноймовірних подій. Знайдіть <i>N</i>, якщо повідомлення несе <i>I = 6</i> бітів інформації.", a: "64", exp: "log<sub>2</sub>(N) = 6 => N = 2<sup>6</sup> = 64." },
            { q: "<b>Практична математика:</b> Розв'яжіть прикладне рівняння для визначення часу досягнення заданого рівня інфляції: <i>log<sub>3</sub>(3x - 6) = 2</i>. Знайдіть <i>x</i>.", a: "5", exp: "3x - 6 = 3<sup>2</sup> => 3x - 6 = 9 => 3x = 15 => x = 5." }
        ];

        let selectedTasks = [];
        let correctAnswers = 0;
        let timerInterval;
        let timeLeft = 20 * 60;

        function startQuiz() {
            const name = document.getElementById('user-name').value.trim();
            if (!name) {
                alert("Будь ласка, введіть прізвище та ім'я!");
                return;
            }
            document.getElementById('display-name').innerText = name;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            // Випадковий вибір 12 завдань із бази
            selectedTasks = practicalPool.sort(() => 0.5 - Math.random()).slice(0, 12);
            renderTasks();
            startTimer();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-grid');
            container.innerHTML = "";
            selectedTasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = "card bg-white border-2 border-slate-200 p-5 rounded-2xl shadow-sm";
                card.innerHTML = `
                    <p class="font-medium text-slate-800 mb-3 text-base">${index + 1}. ${task.q}</p>
                    <div class="flex gap-3 items-center">
                        <input type="text" id="ans-${index}" class="border-2 border-slate-300 rounded-xl px-3 py-2 w-full max-w-xs focus:ring-2 focus:ring-blue-400 focus:border-blue-500 outline-none" placeholder="Введіть число...">
                        <button onclick="checkAnswer(${index})" id="btn-${index}" class="bg-blue-600 text-white font-medium px-5 py-2 rounded-xl hover:bg-blue-700 transition shadow">Перевірити</button>
                    </div>
                    <p id="feedback-${index}" class="mt-2 text-sm hidden font-medium"></p>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(index) {
            const input = document.getElementById(`ans-${index}`);
            const feedback = document.getElementById(`feedback-${index}`);
            const btn = document.getElementById(`btn-${index}`);
            
            const userAnswer = input.value.trim().toLowerCase().replace(',', '.');
            const correctAnswer = selectedTasks[index].a.toLowerCase();

            feedback.classList.remove('hidden');
            if (userAnswer === correctAnswer) {
                feedback.innerHTML = "✅ Правильно!";
                feedback.className = "mt-2 text-sm text-emerald-600 font-bold";
                correctAnswers++;
                updateProgress();
                btn.disabled = true;
                input.disabled = true;
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btn.classList.add('bg-slate-400', 'cursor-not-allowed');
            } else {
                feedback.innerHTML = `❌ Помилка. Пояснення: ${selectedTasks[index].exp}`;
                feedback.className = "mt-2 text-sm text-rose-600";
            }
            
            document.getElementById('correct-count').innerText = correctAnswers;

            // Якщо хоча б одне завдання розв'язано, з'являється кнопка завершення
            if (document.querySelectorAll('input:disabled').length >= 1) {
                document.getElementById('finish-btn').classList.remove('hidden');
            }
        }

        function updateProgress() {
            const runner = document.getElementById('dog-runner');
            const percent = (correctAnswers / 12) * 90; // обмежуємо 90%, щоб не вибігав за межі
            runner.style.left = percent + "%";
            
            if (correctAnswers === 12) {
                runner.innerHTML = "🏆🐶";
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showFinalResults();
                }
            }, 1000);
        }

        function showFinalResults() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const name = document.getElementById('user-name').value;
            const grade12 = Math.round((correctAnswers / 12) * 12);

            document.يجلس = document.getElementById('final-stats').innerHTML = `
                <p>Учень(-ця): <strong>${name}</strong></p>
                <p class="mt-2">Результат: <strong>решено ${correctAnswers} з 12</strong> завдань</p>
                <p class="text-2xl font-bold text-blue-700 mt-3">Орієнтовна оцінка: ${grade12} / 12</p>
            `;

            const adviceList = document.getElementById('advice-list');
            let advices = [
                "Практичні задачі НМТ вимагають уважного читання умов та правильного підставлення чисел у готові формули.",
                "Звертайте особливу увагу на одиниці вимірювання (децибели, моль/л, роки тощо).",
                "Десятковий логарифм (lg) та натуральний (ln) часто зустрічаються у фізичних і хімічних процесах."
            ];

            if (correctAnswers < 6) {
                advices.push("Рекомендуємо повторити базові властивості логарифмів та правила розв'язування простіших показникових і логарифмічних рівнянь.");
            } else if (correctAnswers < 12) {
                advices.push("Хороший результат! Ви добре розумієте застосування формул. Варта уваги уважність у розрахунках з десятковими дробами.");
            } else {
                advices.push("Чудова робота! Ви чудово орієнтуєтеся у прикладному застосуванні математики.");
            }

            adviceList.innerHTML = advices.map(a => `<li>${a}</li>`).join('');
        }
    </script>
</body>
</html>
