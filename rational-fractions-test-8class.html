<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раціональні дроби та степені — Підсумковий тренажер</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-green-bg: #f0fdf4;
            --accent-red-bg: #fef2f2;
            --accent-red: #ef4444;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        main {
            max-width: 850px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .test-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
        }

        .test-header-top {
            text-align: center;
            margin-bottom: 2rem;
        }

        .test-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .test-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .progress-bar-container {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--accent-blue);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-title-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .math-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .options-grid {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .option-btn {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            font-size: 1rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .option-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--accent-blue);
            color: #1d4ed8;
        }

        .test-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .btn {
            background: var(--text-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: #334155;
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-outline {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: #f8fafc;
        }

        /* Стилі результатів та розбору */
        .results-summary-card {
            background: var(--accent-green-bg);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .results-heading {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #166534;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            max-width: 400px;
            margin: 1.5rem auto 0 auto;
        }

        .result-box-item {
            background: white;
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 1rem;
            border-radius: var(--radius-md);
        }

        .result-box-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .result-box-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .recommendations-box {
            background: #fefce8;
            border: 1px solid #fde047;
            border-radius: var(--radius-md);
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .recommendations-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #854d0e;
        }

        .recommendations-list {
            list-style-type: disc;
            margin-left: 1.25rem;
            font-size: 0.9rem;
            color: #713f12;
        }

        .review-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .review-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .review-card.correct-card {
            border-left: 4px solid var(--accent-green);
        }

        .review-card.incorrect-card {
            border-left: 4px solid var(--accent-red);
            background: #fffdfd;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .review-math {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.5rem 0 1rem 0;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            text-align: center;
        }

        .classroom-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .classroom-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .classroom-instructions {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-left: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .classroom-instructions li {
            margin-bottom: 0.3rem;
        }

        @media print {
            header, .classroom-box, .test-footer-nav, .btn {
                display: none !important;
            }
            body {
                background: white;
            }
            .test-card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> На головну
            </a>
            <span style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary);">8 клас · Алгебра</span>
        </div>
    </header>

    <main>
        <div class="test-card" id="app-container">
            <!-- Динамічний вміст тесту або результатів -->
        </div>
    </main>

    <footer>
        <p>© 2026 Математичний Хаб. Дудка Оксана Анатоліївна</p>
    </footer>

    <script>
        const questions = [
            {
                id: 1,
                topic: "Формула різниці кубів",
                question: "Скоротіть дріб:",
                expression: "(x³ + 2x + 8) / (x³ - 27)",
                options: ["1 / (x - 3)", "(x + 2) / (x - 3)", "1 / (x + 3)", "(x - 2) / (x + 3)"],
                correct: 0
            },
            {
                id: 2,
                topic: "Винесення спільного множника за дужки",
                question: "Скоротіть дріб:",
                expression: "(2ax + 8y) / (12xy)",
                options: ["(ax + 4) / 6xy", "(x + 4y) / 6xy", "(ax + 4y) / 6xy", "(x + 4) / 6y"],
                correct: 1
            },
            {
                id: 3,
                topic: "Скорочення степенів зі схожою основою",
                question: "Спростіть вираз:",
                expression: "(a⁵ - a⁴) / (a⁴ - a³)",
                options: ["a²", "a - 1", "a", "a³ / a²"],
                correct: 2
            },
            {
                id: 4,
                topic: "Скорочення дробів зі спільним множником у дужках",
                question: "Скоротіть дріб:",
                expression: "(x(3+k)) / (y(3+k))",
                options: ["x / y", "3 / (x + y)", "x / 3", "k / y"],
                correct: 0
            },
            {
                id: 5,
                topic: "Використання формули різниці квадратів",
                question: "Скоротіть дріб:",
                expression: "(x² - 25) / (x² - 10x + 25)",
                options: ["(x - 5) / (x + 5)", "(x + 5) / (x - 5)", "1 / (x - 5)", "x + 5"],
                correct: 1
            },
            {
                id: 6,
                topic: "Різниця квадратів у чисельнику та різниця степенів у знаменнику",
                question: "Скоротіть дріб:",
                expression: "(x² - 4) / (x³ - 2x²)",
                options: ["(x + 2) / x²", "1 / x", "(x - 2) / x", "2 / x²"],
                correct: 0
            },
            {
                id: 7,
                topic: "Скорочення дробів зі степенями",
                question: "Спростіть вираз:",
                expression: "(y⁶ - y⁴) / (y⁴ - y²)",
                options: ["y²", "y", "y³", "1"],
                correct: 0
            },
            {
                id: 8,
                topic: "Формула суми кубів та скорочення",
                question: "Скоротіть дріб:",
                expression: "(x³ + 8) / (x² - 2x + 4)",
                options: ["x - 2", "x + 2", "1 / (x + 2)", "(x + 2)²"],
                correct: 1
            },
            {
                id: 9,
                topic: "Властивості протилежних виразів у дужках",
                question: "Скоротіть дріб:",
                expression: "a(b - c) / c(c - b)",
                options: ["a / c", "-a / c", "a / (c - b)", "-1"],
                correct: 1
            },
            {
                id: 10,
                topic: "Винесення спільного чисельного множника",
                question: "Скоротіть дріб:",
                expression: "(9a - 9b) / 8(a - b)",
                options: ["9 / 8", "1 / 8", "8 / 9", "(a - b) / 8"],
                correct: 0
            },
            {
                id: 11,
                topic: "Метод групування у чисельнику",
                question: "Скоротіть дріб:",
                expression: "(2a + ab + 2b - b²) / (5a - 5b)",
                options: ["(2 + b) / 5", "(2 - b) / 5", "(a + 2b) / 5", "(2 + a) / 5"],
                correct: 0
            },
            {
                id: 12,
                topic: "Скорочення степенів із однаковою основою",
                question: "Скоротіть дріб:",
                expression: "(3(y - 4)²) / (y - 4)",
                options: ["3(y - 4)", "3 / (y - 4)", "y - 4", "3"],
                correct: 0
            }
        ];

        let currentIdx = 0;
        let userAnswers = new Array(questions.length).fill(null);

        const container = document.getElementById('app-container');

        function renderQuestion() {
            const q = questions[currentIdx];
            const progressPercent = ((currentIdx + 1) / questions.length) * 100;

            container.innerHTML = `
                <div class="test-header-top">
                    <div class="test-title">Раціональні дроби та степені</div>
                    <div class="test-subtitle">Підсумковий тренажер-перетворення виразів та скорочення дробів</div>
                </div>
                
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                </div>

                <div class="question-meta">
                    <span>Завдання ${currentIdx + 1} із ${questions.length} (+1 бал)</span>
                    <span>${q.topic}</span>
                </div>

                <div class="question-title-text">${q.question}</div>
                <div class="math-box">${q.expression}</div>

                <div class="options-grid">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn ${userAnswers[currentIdx] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                            ${opt}
                        </button>
                    `).join('')}
                </div>

                <div class="test-footer-nav">
                    <button class="btn btn-outline" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>
                        <i class="fa-solid fa-arrow-left"></i> Назад
                    </button>
                    <button class="btn" onclick="nextQuestion()">
                        ${currentIdx === questions.length - 1 ? 'Завершити тест' : 'Далі'} <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
        }

        function selectOption(optionIndex) {
            userAnswers[currentIdx] = optionIndex;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            let correctCount = 0;
            let incorrectTopics = new Set();

            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) {
                    correctCount++;
                } else {
                    incorrectTopics.add(q.topic);
                }
            });

            // Розрахунок за 12-бальною шкалою
            const grade12 = Math.round((correctCount / questions.length) * 11) + (correctCount > 0 ? 1 : 0);

            let recommendationsHtml = '';
            if (incorrectTopics.size > 0) {
                let topicsList = Array.from(incorrectTopics).map(t => `<li>${t}</li>`).join('');
                recommendationsHtml = `
                    <div class="recommendations-box">
                        <div class="recommendations-title"><i class="fa-solid fa-triangle-exclamation"></i> Рекомендації та теми для повторення:</div>
                        <ul class="recommendations-list">${topicsList}</ul>
                    </div>
                `;
            } else {
                recommendationsHtml = `
                    <div class="recommendations-box" style="background: var(--accent-green-bg); border-color: rgba(34,197,94,0.3);">
                        <div class="recommendations-title" style="color: #166534;"><i class="fa-solid fa-circle-check"></i> Чудовий результат!</div>
                        <div style="font-size: 0.9rem; color: #15803d;">Ви бездоганно впоралися з усіма завданнями тесту!</div>
                    </div>
                `;
            }

            let reviewCardsHtml = questions.map((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                const userAnsText = userAnswers[idx] !== null ? q.options[userAnswers[idx]] : 'Не відповідено';
                const correctAnsText = q.options[q.correct];

                return `
                    <div class="review-card ${isCorrect ? 'correct-card' : 'incorrect-card'}">
                        <div class="review-header">
                            <span>Завдання ${idx + 1}. Провідна тема: ${q.topic}</span>
                            <span style="color: ${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight: 700;">
                                ${isCorrect ? '+1 бал' : '0 балів'}
                            </span>
                        </div>
                        <div style="font-size: 0.95rem; font-weight: 500; margin-bottom: 0.5rem;">${q.question}</div>
                        <div class="review-math">${q.expression}</div>
                        <div style="font-size: 0.9rem; margin-top: 0.5rem;">
                            <strong>Ваша відповідь:</strong> <span style="color: ${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'};">${userAnsText}</span>
                        </div>
                        ${!isCorrect ? `
                            <div style="font-size: 0.9rem; margin-top: 0.25rem;">
                                <strong>Правильна відповідь:</strong> <span style="color: var(--accent-green);">${correctAnsText}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="results-summary-card">
                    <div class="results-heading">Тестування завершено!</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem;">Перевірка знань з теми «Раціональні дроби»</div>
                    
                    <div class="results-grid">
                        <div class="result-box-item">
                            <div class="result-box-label">Бали (12-бальна шкала)</div>
                            <div class="result-box-value">${grade12} / 12</div>
                        </div>
                        <div class="result-box-item">
                            <div class="result-box-label">Правильні відповіді</div>
                            <div class="result-box-value">${correctCount} / ${questions.length}</div>
                        </div>
                    </div>
                </div>

                ${recommendationsHtml}

                <div class="classroom-box">
                    <div class="classroom-title"><i class="fa-solid fa-circle-info"></i> Як зберегти результати та надіслати в Google Classroom:</div>
                    <ol class="classroom-instructions">
                        <li>Натисніть кнопку <strong>«Зберегти результат (PDF)»</strong> нижче.</li>
                        <li>У вікні друку, що відкриється, у полі «Принтер (Destination)» виберіть <strong>«Зберегти як PDF» (Save as PDF)</strong>.</li>
                        <li>Збережіть файл на свій пристрій (бажано перейменувавши його, вказавши своє прізвище).</li>
                        <li>Зайдіть у Google Classroom, прикріпіть цей збережений PDF-файл у завданні «Домашня робота» та натисніть «Здати».</li>
                    </ol>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button class="btn" onclick="window.print()">
                            <i class="fa-solid fa-file-pdf"></i> Зберегти результат (PDF)
                        </button>
                        <button class="btn btn-outline" onclick="restartTest()">
                            <i class="fa-solid fa-rotate-right"></i> Пройти знову
                        </button>
                    </div>
                </div>

                <div class="review-section-title">Детальний розгляд завдань:</div>
                <div>${reviewCardsHtml}</div>
            `;
        }

        function restartTest() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            renderQuestion();
        }

        // Запуск під час завантаження
        renderQuestion();
    </script>
</body>
</html>
