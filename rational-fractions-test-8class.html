<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Раціональні дроби | Математичний Хаб</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-green: #22c55e;
            --accent-green-light: #f0fdf4;
            --accent-blue: #3b82f6;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--text-primary);
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }

        .card-badges {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .badge-grade { background: #e0f2fe; color: #0369a1; }
        .badge-algebra { background: #fef3c7; color: #b45309; }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .task-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.85rem 1rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .task-option:hover {
            background: #f8fafc;
            border-color: var(--accent-blue);
        }

        .task-option.correct {
            background: var(--accent-green-light);
            border-color: var(--accent-green);
            color: #15803d;
            font-weight: 600;
        }

        .task-option.wrong {
            background: #fef2f2;
            border-color: #ef4444;
            color: #b91c1c;
        }

        .btn-primary {
            background: var(--text-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .progress-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
                <span>Математичний Хаб</span>
            </a>
            <div style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500;">
                Дудка Оксана Анатоліївна
            </div>
        </div>
    </header>

    <main>
        <div class="card" id="test-container">
            <!-- Динамічний вміст тесту -->
        </div>
    </main>

    <footer>
        <p>© 2026 Математичний Хаб. Авторські матеріали з математики.</p>
    </footer>

    <script>
        const questions = [
            {
                task: "Знайдіть допустимі значення змінної у виразі: 5 / (x - 3)",
                options: ["x будь-яке число", "x ≠ 3", "x ≠ -3", "x = 3"],
                correct: 1
            },
            {
                task: "Скоротіть дріб: 3a² / 6a³",
                options: ["1 / (2a)", "2 / a", "2a", "1 / (3a)"],
                correct: 0
            },
            {
                task: "Виконайте додавання: 2x / 7 + 3x / 7",
                options: ["5x / 14", "5x² / 7", "5x / 7", "5x"],
                correct: 2
            },
            {
                task: "Подайте у вигляді дробу вираз: a² / (a - b) - b² / (a - b)",
                options: ["a - b", "a + b", "1", "(a + b) / (a - b)"],
                correct: 1
            },
            {
                task: "Виконайте множення дробів: (2x / 3y) · (9y² / 4x²)",
                options: ["3y / (2x)", "2x / (3y)", "6xy / 12", "3 / 2"],
                correct: 0
            },
            {
                task: "Виконайте ділення: (5a / b²) : (10a² / b)",
                options: ["2a / b", "1 / (2ab)", "2b / a", "2ab"],
                correct: 1
            },
            {
                task: "Спростіть вираз: (x² - 9) / (x + 3)",
                options: ["x + 3", "x - 3", "x - 9", "3"],
                correct: 1
            },
            {
                task: "Знайдіть значення виразу 2 / (x - 2) + 1 / (x + 2), якщо x = 4",
                options: ["3 / 4", "5 / 12", "1", "1 / 2"],
                correct: 1
            },
            {
                task: "Який дріб тотожно рівний дробу -a / (b - c)?",
                options: ["a / (b - c)", "a / (c - b)", "-a / (-b + c)", "a / (b + c)"],
                correct: 1
            },
            {
                task: "Виконайте піднесення до степеня: (2x² / y³)³",
                options: ["6x⁶ / y⁹", "8x⁵ / y⁶", "8x⁶ / y⁹", "2x⁶ / y⁹"],
                correct: 2
            },
            {
                task: "Спростіть вираз: 4x / (x - 2) - 8 / (x - 2)",
                options: ["4", "4x", "4 / (x - 2)", "1"],
                correct: 0
            },
            {
                task: "Розв'яжіть рівняння: (x² - 4) / (x - 2) = 0",
                options: ["2", "-2", "2 та -2", "коренів немає"],
                correct: 1
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentIndex];
            const container = document.getElementById('test-container');

            container.innerHTML = `
                <div class="card-badges">
                    <span class="badge badge-grade">8 клас</span>
                    <span class="badge badge-algebra">Алгебра</span>
                </div>
                <div class="progress-info">Запитання ${currentIndex + 1} із ${questions.length}</div>
                <div class="card-title">${q.task}</div>
                <div id="options-box">
                    ${q.options.map((opt, idx) => `
                        <button class="task-option" onclick="checkAnswer(${idx})">${opt}</button>
                    `).join('')}
                </div>
                <div id="action-container"></div>
            `;
            answered = false;
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.task-option');

            buttons.forEach((btn, idx) => {
                btn.style.cursor = 'default';
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedIndex) {
                    btn.classList.add('wrong');
                }
            });

            if (selectedIndex === q.correct) {
                score++;
            }

            const actionContainer = document.getElementById('action-container');
            const isLast = currentIndex === questions.length - 1;

            actionContainer.innerHTML = `
                <button class="btn-primary" onclick="${isLast ? 'showResults()' : 'nextQuestion()'}">
                    ${isLast ? 'Переглянути результати' : 'Наступне запитання'}
                </button>
            `;
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function showResults() {
            const container = document.getElementById('test-container');
            let grade12 = Math.round((score / questions.length) * 11 + 1);
            if (grade12 > 12) grade12 = 12;

            container.innerHTML = `
                <div class="card-badges">
                    <span class="badge badge-grade">8 клас</span>
                    <span class="badge badge-algebra">Алгебра</span>
                </div>
                <div class="card-title">Тест завершено!</div>
                <div class="card-desc">
                    Ви правильно відповіли на <b>${score}</b> із <b>${questions.length}</b> завдань.<br>
                    Оцінка за 12-бальною шкалою: <b style="color: var(--accent-green);">${grade12} балів</b>
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <a href="index.html" class="btn-primary" style="text-decoration: none; display: inline-block;">Повернутися до Хабу</a>
                    <button class="btn-primary" onclick="restartTest()" style="background: white; color: var(--text-primary); border: 1px solid var(--border-color);">Пройти знову</button>
                </div>
            `;
        }

        function restartTest() {
            currentIndex = 0;
            score = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
