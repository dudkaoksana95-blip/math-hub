<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математичний Хаб | Дудка Оксана Анатоліївна</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-green: #22c55e;
            --accent-green-light: #f0fdf4;
            --accent-blue: #3b82f6;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--text-primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .hero-banner {
            background: var(--accent-green-light);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: var(--radius-lg);
            padding: 1.75rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .hero-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        .filter-subgroup .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .search-box {
            position: relative;
            max-width: 350px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 0.9rem;
            background: white;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .card-badges {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .badge-grade { background: #e0f2fe; color: #0369a1; }
        .badge-algebra { background: #fef3c7; color: #b45309; }
        .badge-geometry { background: #fce7f3; color: #be185d; }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-container {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .task-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .task-option:hover {
            background: #f8fafc;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: auto;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-shapes"></i></div>
                <span>Математичний Хаб</span>
            </a>
            <div style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500;">
                Дудка Оксана Анатоліївна
            </div>
        </div>
    </header>

    <main>
        <div class="hero-banner">
            <div>
                <div class="hero-title">Інтерактивні математичні матеріали</div>
                <div class="hero-subtitle">Тренажери, тести та довідники для 8–11 класів та підготовки до НМТ</div>
            </div>
        </div>

        <div class="controls-section">
            <div class="filter-group" id="grade-filters">
                <button class="filter-btn active" data-grade="all">Усі класи</button>
                <button class="filter-btn" data-grade="grade8">8 клас</button>
                <button class="filter-btn" data-grade="grade9">9 клас</button>
                <button class="filter-btn" data-grade="grade10">10 клас</button>
                <button class="filter-btn" data-grade="grade11">11 клас</button>
                <button class="filter-btn" data-grade="nmt">НМТ Підготовка</button>
            </div>

            <div style="display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
                <div class="filter-group filter-subgroup" id="subject-filters">
                    <button class="filter-btn active" data-subject="all">Усі предмети</button>
                    <button class="filter-btn" data-subject="algebra">Алгебра</button>
                    <button class="filter-btn" data-subject="geometry">Геометрія</button>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Пошук теми чи розділу...">
                </div>
            </div>
        </div>

        <div class="cards-grid" id="cards-container"></div>
    </main>

    <div class="modal-overlay" id="interactive-modal">
        <div class="modal-container">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 Математичний Хаб. Авторські матеріали з математики.</p>
    </footer>

    <script>
        const itemsData = [
            {
                id: 1,
                title: "Раціональні вирази та дроби",
                desc: "Тренажер додавання, віднімання та скорочення раціональних дробів.",
                grade: "grade8",
                subject: "algebra",
                gradeLabel: "8 клас",
                type: "trainer",
                task: "Обчисліть значення виразу (x² - 4) / (x - 2) при x = 5:",
                options: ["3", "7", "10", "25"],
                correct: 1
            },
            {
                id: 2,
                title: "Чотирикутники та їх властивості",
                desc: "Властивості паралелограма, ромба, прямокутника та трапеції.",
                grade: "grade8",
                subject: "geometry",
                gradeLabel: "8 клас",
                type: "theory",
                content: "<b>Паралелограм:</b> протилежні сторони та кути рівні, діагоналі точкою перетину діляться навпіл.<br><br><b>Ромб:</b> усі сторони рівні, діагоналі перпендикулярні."
            },
            {
                id: 3,
                title: "Квадратична функція та її графік",
                desc: "Знаходження вершин параболи, нулів функції та проміжків знакосталості.",
                grade: "grade9",
                subject: "algebra",
                gradeLabel: "9 клас",
                type: "trainer",
                task: "Знайдіть абсцису вершини параболи y = x² - 6x + 8:",
                options: ["x = 3", "x = -3", "x = 6", "x = 0"],
                correct: 0
            },
            {
                id: 4,
                title: "Степінь n-го степеня та арифм. корінь",
                desc: "Властивості коренів та перетворення виразів зі степенями.",
                grade: "grade10",
                subject: "algebra",
                gradeLabel: "10 клас",
                type: "trainer",
                task: "Обчисліть значення виразу ∛27 + ∜16:",
                options: ["5", "7", "6", "12"],
                correct: 0
            },
            {
                id: 5,
                title: "Вступ до стереометрії",
                desc: "Аксіоми стереометрії, взаємне розміщення прямих і площин у просторі.",
                grade: "grade10",
                subject: "geometry",
                gradeLabel: "10 клас",
                type: "theory",
                content: "<b>Основні аксіоми:</b><br>1. Через будь-які три точки, що не лежать на одній прямій, можна провести площину і до того ж тільки одну.<br>2. Якщо дві точки прямої належать площині, то й уся пряма належить цій площині."
            },
            {
                id: 6,
                title: "Показникові рівняння",
                desc: "Тренажер підвищеної складності: заміна змінної, винесення за дужки, модулі та ОДЗ.",
                grade: "grade11",
                subject: "algebra",
                gradeLabel: "11 клас",
                type: "trainer",
                link: "exponential-trainer.html"
            },
            {
                id: 9,
                title: "НМТ Тренажер: Логарифми",
                desc: "Тренажер підвищеної складності: властивості, рівняння, нерівності та відповідності.",
                grade: "grade11",
                subject: "algebra",
                gradeLabel: "11 клас / НМТ",
                type: "trainer",
                link: "logarithms-trainer.html"
            },
            {
                id: 10,
                title: "НМТ Тренажер: Класифікація дійсних чисел",
                desc: "Інтерактивний тренажер з числовими множинами, таймером та протоколом результатів.",
                grade: "grade11",
                subject: "algebra",
                gradeLabel: "11 клас / НМТ",
                type: "trainer",
                link: "numbers-trainer.html"
            },
            {
                id: 7,
                title: "Многогранники: Призма та Піраміда",
                desc: "Формули площі поверхні та об'ємів призми й піраміди.",
                grade: "grade11",
                subject: "geometry",
                gradeLabel: "11 клас",
                type: "theory",
                content: "<b>Призма:</b> V = S_основи · h<br><b>Піраміда:</b> V = (1/3) · S_основи · h"
            },
            {
                id: 8,
                title: "НМТ Тренажер: Комплексний тест",
                desc: "Підсумковий експрес-тест за програмою НМТ з алгебри та геометрії.",
                grade: "nmt",
                subject: "algebra",
                gradeLabel: "НМТ",
                type: "trainer",
                task: "Обчисліть log₂8 + log₃9:",
                options: ["5", "6", "4", "3"],
                correct: 0
            },
            {
                id: 11,
                title: "НМТ Тренажер: Практичні логарифми",
                desc: "Прикладні задачі з фізики, хімії, біології та фінансів: таймер, анімація та протокол результатів.",
                grade: "grade11",
                subject: "algebra",
                gradeLabel: "11 клас / НМТ",
                type: "trainer",
                link: "logarithm-practical.html"
            }
        ];

        let activeGrade = 'all';
        let activeSubject = 'all';

        function renderCards() {
            const container = document.getElementById('cards-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            container.innerHTML = '';

            const filtered = itemsData.filter(item => {
                const matchGrade = activeGrade === 'all' || item.grade === activeGrade;
                const matchSubject = activeSubject === 'all' || item.subject === activeSubject;
                const matchSearch = item.title.toLowerCase().includes(searchVal) || item.desc.toLowerCase().includes(searchVal);
                return matchGrade && matchSubject && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">Матеріалів за обраними фільтрами не знайдено.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    if (item.link) {
                        window.open(item.link, '_blank');
                    } else {
                        openModal(item);
                    }
                };

                const subjClass = item.subject === 'algebra' ? 'badge-algebra' : 'badge-geometry';
                const subjText = item.subject === 'algebra' ? 'Алгебра' : 'Геометрія';

                card.innerHTML = `
                    <div>
                        <div class="card-badges">
                            <span class="badge badge-grade">${item.gradeLabel}</span>
                            <span class="badge ${subjClass}">${subjText}</span>
                        </div>
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--accent-blue); display: flex; align-items: center; gap: 5px;">
                        <span>Відкрити завдання</span> <i class="fa-solid fa-arrow-right"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(item) {
            const modal = document.getElementById('interactive-modal');
            const content = document.getElementById('modal-content');

            if (item.type === 'trainer') {
                content.innerHTML = `
                    <div class="badge badge-grade" style="display:inline-block; margin-bottom: 0.5rem;">${item.gradeLabel}</div>
                    <h2 style="margin-bottom: 1rem;">${item.title}</h2>
                    <p style="margin-bottom: 1.5rem; font-weight: 500;">${item.task}</p>
                    <div id="options-box">
                        ${item.options.map((opt, idx) => `
                            <button class="task-option" onclick="checkAnswer(${idx}, ${item.correct})">${opt}</button>
                        `).join('')}
                    </div>
                    <div id="result-box" style="margin-top: 1rem; font-weight: 600;"></div>
                `;
            } else {
                content.innerHTML = `
                    <div class="badge badge-grade" style="display:inline-block; margin-bottom: 0.5rem;">${item.gradeLabel}</div>
                    <h2 style="margin-bottom: 1rem;">${item.title}</h2>
                    <div style="line-height: 1.6; color: var(--text-primary); background: #f8fafc; padding: 1rem; border-radius: 12px;">
                        ${item.content}
                    </div>
                `;
            }

            modal.style.display = 'flex';
        }

        function checkAnswer(selected, correct) {
            const resBox = document.getElementById('result-box');
            if (selected === correct) {
                resBox.innerHTML = `<span style="color: var(--accent-green);"><i class="fa-solid fa-circle-check"></i> Правильно! Чудова робота!</span>`;
            } else {
                resBox.innerHTML = `<span style="color: #ef4444;"><i class="fa-solid fa-circle-xmark"></i> Неправильно. Спробуйте ще раз!</span>`;
            }
        }

        function closeModal() {
            document.getElementById('interactive-modal').style.display = 'none';
        }

        document.getElementById('grade-filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#grade-filters .filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                activeGrade = e.target.dataset.grade;
                renderCards();
            }
        });

        document.getElementById('subject-filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('#subject-filters .filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                activeSubject = e.target.dataset.subject;
                renderCards();
            }
        });

        document.getElementById('search-input').addEventListener('input', renderCards);

        renderCards();
    </script>
</body>
</html>
