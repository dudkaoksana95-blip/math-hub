<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер з алгебри (11 клас): Показникові рівняння</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2980b9;
            --success-color: #27ae60;
            --danger-color: #c0392b;
            --bg-color: #f8f9fa; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px; 
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ecf0f1;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .timer {
            color: var(--danger-color);
            font-size: 1.1rem;
        }

        .task-card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .task-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #fff;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background: #f1f2f6;
            border-color: var(--accent-color);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #219653;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Показникові рівняння</h1>
    <div class="subtitle">Тренажер підвищеної складності (11 клас)</div>

    <div class="header-panel">
        <div>Завдання: <span id="current-progress">1 / 5</span></div>
        <div class="timer">⏱ Залишилось: <span id="time-left">40:00</span></div>
    </div>

    <div id="quiz-container">
        <!-- Сюди динамічно завантажуватимуться завдання -->
    </div>

    <button class="btn-submit" id="submit-btn" onclick="checkResults()">Завершити тест і перевірити</button>

    <div id="result-box" class="result-box"></div>
</div>

<script>
    const tasks = [
        {
            id: 1,
            question: "Розв'яжіть рівняння: 2<sup>x+3</sup> = 16",
            options: ["x = 1", "x = 2", "x = 3", "x = 0"],
            correct: 0
        },
        {
            id: 2,
            question: "Знайдіть корінь рівняння: 3<sup>2x - 4</sup> = 9",
            options: ["x = 1", "x = 2", "x = 3", "x = 4"],
            correct: 2
        },
        {
            id: 3,
            question: "Розв'яжіть рівняння: 5<sup>x</sup> + 5<sup>x+1</sup> = 150",
            options: ["x = 1", "x = 2", "x = 3", "x = 4"],
            correct: 1
        },
        {
            id: 4,
            question: "Знайдіть суму коренів рівняння: 4<sup>x</sup> - 5·2<sup>x</sup> + 4 = 0",
            options: ["0", "1", "2", "3"],
            correct: 2
        },
        {
            id: 5,
            question: "Розв'яжіть рівняння: (1/3)<sup>x-2</sup> = 27",
            options: ["x = -1", "x = 0", "x = 1", "x = 2"],
            correct: 0
        }
    ];

    let userAnswers = {};

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';
        tasks.forEach((task, index) => {
            html += `
                <div class="task-card">
                    <div class="task-title">Завдання ${index + 1}: ${task.question}</div>
                    <div class="options-group">
            `;
            task.options.forEach((opt, optIdx) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="task_${task.id}" value="${optIdx}" onchange="userAnswers[${task.id}] = ${optIdx}">
                        ${opt}
                    </label>
                `;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    function checkResults() {
        let score = 0;
        tasks.forEach(task => {
            if (userAnswers[task.id] === task.correct) {
                score++;
            }
        });

        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.style.background = score >= 4 ? "#d4edda" : "#f8d7da";
        resultBox.style.color = score >= 4 ? "#155724" : "#721c24";
        resultBox.innerHTML = `Ваш результат: ${score} з ${tasks.length} балів!`;
    }

    // Таймер на 40 хвилин
    let totalSeconds = 40 * 60;
    setInterval(() => {
        if (totalSeconds > 0) {
            totalSeconds--;
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            document.getElementById('time-left').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    }, 1000);

    renderQuiz();
</script>

</body>
</html>
