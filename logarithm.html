<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логарифмічна Дошка: Практика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .math { font-family: "Times New Roman", serif; font-style: italic; }
        #dog-track { position: relative; height: 60px; background: #e2e8f0; border-radius: 30px; overflow: hidden; }
        #dog-runner { 
            position: absolute; left: 0; transition: all 0.5s ease-out; 
            font-size: 40px; line-height: 60px;
        }
        .finish-line { position: absolute; right: 10px; font-weight: bold; color: #ef4444; line-height: 60px; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-blue-50 min-h-screen p-4 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold">Інтерактивна дошка: Логарифми в житті</h1>
            <p class="mt-2 opacity-90">Застосування та практичні задачі (11 клас)</p>
        </div>

        <div id="start-screen" class="p-10 text-center">
            <label class="block text-lg mb-4">Введіть своє ім'я, щоб розпочати:</label>
            <input type="text" id="user-name" class="border-2 border-indigo-300 rounded-lg px-4 py-2 mb-6 w-64 text-center focus:outline-none focus:border-indigo-600">
            <button onclick="startQuiz()" class="block mx-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-full transition">Почати тест (20 хв)</button>
        </div>

        <div id="quiz-screen" class="hidden p-6">
            <div class="flex justify-between items-center mb-6 bg-gray-100 p-4 rounded-xl">
                <div>Учень: <span id="display-name" class="font-bold text-indigo-600"></span></div>
                <div class="text-xl font-mono font-bold text-red-500">⏳ <span id="timer">20:00</span></div>
                <div class="font-bold">✅ Правильно: <span id="correct-count">0</span>/12</div>
            </div>

            <div class="mb-8">
                <p class="text-sm mb-1 text-gray-500">Ваш Джек Рассел біжить до фінішу:</p>
                <div id="dog-track">
                    <div class="finish-line">🚩 ФІНІШ</div>
                    <div id="dog-runner">🐶</div>
                </div>
            </div>

            <div id="tasks-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                </div>

            <button id="finish-btn" onclick="showFinalResults()" class="hidden w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transition">ГОТОВО (Переглянути поради)</button>
        </div>

        <div id="result-screen" class="hidden p-10 text-center">
            <h2 class="text-4xl font-bold mb-4">Тест завершено!</h2>
            <div id="final-stats" class="text-xl mb-6"></div>
            <div id="advice-box" class="bg-yellow-50 p-6 rounded-2xl text-left border-l-8 border-yellow-400">
                <h3 class="font-bold text-lg mb-2">💡 Поради для повторення:</h3>
                <ul id="advice-list" class="list-disc ml-5 space-y-2"></ul>
            </div>
            <button onclick="location.reload()" class="mt-8 text-indigo-600 underline">Спробувати ще раз (інші завдання)</button>
        </div>
    </div>

    <script>
        // Велика база даних (24 завдання), з якої випадково вибирається 12
        const allTasks = [
            { q: "Інтенсивність звуку дорівнює 10<sup>-5</sup> Вт/м². Обчисліть рівень гучності в децибелах за формулою L = 10 · lg(I/I<sub>0</sub>), де I<sub>0</sub>=10<sup>-12</sup>.", a: "70", exp: "L = 10 · lg(10<sup>-5</sup>/10<sup>-12</sup>) = 10 · lg(10<sup>7</sup>) = 10 · 7 = 70." },
            { q: "Обчисліть pH розчину, якщо концентрація іонів водню [H<sup>+</sup>] = 10<sup>-3</sup> моль/л. (pH = -lg[H<sup>+</sup>])", a: "3", exp: "pH = -lg(10<sup>-3</sup>) = -(-3) = 3." },
            { q: "Вклад у банку зростає за формулою S = S<sub>0</sub>(1.1)<sup>n</sup>. Через скільки років сума подвоїться? (n = log<sub>1.1</sub>2 ≈ 7, округліть до цілого).", a: "7", exp: "За формулою складних відсотків n ≈ 0.69/0.1 ≈ 7 років." },
            { q: "Розв'яжіть рівняння: log<sub>2</sub>x = 5. Яку кількість бактерій x ми отримаємо через 5 періодів подвоєння?", a: "32", exp: "x = 2<sup>5</sup> = 32." },
            { q: "Яскравість зірок m<sub>1</sub> - m<sub>2</sub> = -2.5 lg(L<sub>1</sub>/L<sub>2</sub>). Якщо L<sub>1</sub>/L<sub>2</sub> = 100, чому дорівнює різниця зіркових величин?", a: "-5", exp: "-2.5 · lg(100) = -2.5 · 2 = -5." },
            { q: "Обчисліть: log<sub>3</sub>x = 4. Чому дорівнює x?", a: "81", exp: "x = 3<sup>4</sup> = 3 · 3 · 3 · 3 = 81." },
            { q: "Яке значення x при log<sub>x</sub>25 = 2?", a: "5", exp: "x<sup>2</sup> = 25, отже x = 5 (основа логарифма > 0)." },
            { q: "Знайдіть значення виразу: log<sub>2</sub>16 + log<sub>2</sub>2.", a: "5", exp: "log<sub>2</sub>16 = 4, log<sub>2</sub>2 = 1. Разом 4 + 1 = 5." },
            { q: "Обчисліть: lg 1000 - lg 10.", a: "2", exp: "3 - 1 = 2." },
            { q: "Для функції y = log<sub>2</sub>(x-3) знайдіть найменше ціле значення x, при якому вона визначена.", a: "4", exp: "x-3 > 0 => x > 3. Найменше ціле x = 4." },
            { q: "Обчисліть pH, якщо [H<sup>+</sup>] = 10<sup>-7</sup> (нейтральне середовище).", a: "7", exp: "-lg(10<sup>-7</sup>) = 7." },
            { q: "Обчисліть значення десяткового логарифма: lg 10.", a: "1", exp: "lg 10 - це логарифм за основою 10 від 10, що дорівнює 1." },
            { q: "Спростіть: log<sub>5</sub>125.", a: "3", exp: "5<sup>3</sup> = 125." },
            { q: "Знайдіть x: log<sub>0.5</sub>x = -1.", a: "2", exp: "x = (0.5)<sup>-1</sup> = (1/2)<sup>-1</sup> = 2." },
            { q: "Обчисліть: 5<sup>log<sub>5</sub>12</sup>.", a: "12", exp: "За основною логарифмічною тотожністю a<sup>log<sub>a</sub>b</sup> = b." },
            { q: "Знайдіть область визначення функції: y = log<sub>3</sub>(-x). При яких x функція існує?", a: "x<0", exp: "Вираз під логарифмом має бути додатним: -x > 0 => x < 0." },
            { q: "Чому дорівнює log<sub>a</sub>a?", a: "1", exp: "Будь-яке число в першому степені дорівнює самому собі." },
            { q: "Обчисліть: log<sub>2</sub>(1/8).", a: "-3", exp: "2<sup>-3</sup> = 1/8." },
            { q: "Спростіть: lg 2 + lg 5.", a: "1", exp: "lg(2·5) = lg 10 = 1." },
            { q: "Чому дорівнює x: log<sub>3</sub>(2x - 1) = 2?", a: "5", exp: "2x - 1 = 3<sup>2</sup> => 2x - 1 = 9 => 2x = 10 => x = 5." },
            { q: "Знайдіть log<sub>4</sub>2.", a: "0.5", exp: "4<sup>0.5</sup> = √4 = 2." },
            { q: "Обчисліть: log<sub>7</sub>1.", a: "0", exp: "Будь-яке число в нульовому степені дорівнює 1." },
            { q: "Знайдіть x, якщо ln x = 0.", a: "1", exp: "e<sup>0</sup> = 1." },
            { q: "Обчисліть значення x: log<sub>2</sub>x + log<sub>2</sub>3 = log<sub>2</sub>12.", a: "4", exp: "log<sub>2</sub>(3x) = log<sub>2</sub>12 => 3x = 12 => x = 4." }
        ];

        let selectedTasks = [];
        let correctAnswers = 0;
        let timerInterval;
        let timeLeft = 20 * 60; // 20 хвилин

        function startQuiz() {
            const name = document.getElementById('user-name').value;
            if (!name) {
                alert("Будь ласка, введіть ім'я!");
                return;
            }
            document.getElementById('display-name').innerText = name;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            // Перемішуємо і вибираємо 12 завдань
            selectedTasks = allTasks.sort(() => 0.5 - Math.random()).slice(0, 12);
            renderTasks();
            startTimer();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-grid');
            selectedTasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = "card bg-white border-2 border-indigo-100 p-4 rounded-2xl shadow-sm";
                card.innerHTML = `
                    <p class="font-medium text-gray-800 mb-3">${index + 1}. ${task.q}</p>
                    <div class="flex gap-2">
                        <input type="text" id="ans-${index}" class="border rounded px-2 py-1 w-full focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="Відповідь...">
                        <button onclick="checkAnswer(${index})" id="btn-${index}" class="bg-indigo-500 text-white px-4 py-1 rounded hover:bg-indigo-600 transition">Перевірити</button>
                    </div>
                    <p id="feedback-${index}" class="mt-2 text-sm hidden"></p>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(index) {
            const input = document.getElementById(`ans-${index}`);
            const feedback = document.getElementById(`feedback-${index}`);
            const btn = document.getElementById(`btn-${index}`);
            const userAnswer = input.value.trim().toLowerCase().replace(',', '.');
            const correctAnswer = selectedTasks[index].a.toLowerCase();

            feedback.classList.remove('hidden');
            if (userAnswer === correctAnswer) {
                feedback.innerHTML = "✅ Правильно!";
                feedback.className = "mt-2 text-sm text-green-600 font-bold";
                correctAnswers++;
                updateProgress();
                btn.disabled = true;
                input.disabled = true;
                btn.classList.add('bg-gray-400');
            } else {
                feedback.innerHTML = `❌ Неправильно. Пояснення: ${selectedTasks[index].exp}`;
                feedback.className = "mt-2 text-sm text-red-600";
            }
            
            document.getElementById('correct-count').innerText = correctAnswers;

            if (document.querySelectorAll('button[disabled]').length >= 1) {
                document.getElementById('finish-btn').classList.remove('hidden');
            }
        }

        function updateProgress() {
            const runner = document.getElementById('dog-runner');
            const percent = (correctAnswers / 12) * 90; // до 90% щоб собака не виліз за фініш
            runner.style.left = percent + "%";
            
            if (correctAnswers === 12) {
                runner.innerHTML = "🏆🐶";
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = 
                    `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showFinalResults();
                }
            }, 1000);
        }

        function showFinalResults() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const name = document.getElementById('user-name').value;
            document.getElementById('final-stats').innerHTML = `
                <p>${name}, ваш результат: <strong>${correctAnswers}</strong> з 12 правильних відповідей!</p>
            `;

            const adviceList = document.getElementById('advice-list');
            const advices = [
                "Повторіть означення логарифма: це показник степеня, до якого треба піднести основу.",
                "Зверніть увагу на ОДЗ: вираз під логарифмом завжди має бути додатним (> 0).",
                "Властивості суми та різниці логарифмів часто допомагають спростити складні вирази.",
                "Логарифми широко використовуються в хімії (pH), фізиці (гучність звуку) та фінансах."
            ];

            if (correctAnswers < 6) {
                advices.push("Вам варто ще раз переглянути основну логарифмічну тотожність.");
            } else if (correctAnswers < 12) {
                advices.push("Чудовий результат! Продовжуйте тренуватися, щоб досягти максимального успіху.");
            } else {
                advices.push("Ви — справжній майстер логарифмів! Джек Рассел неймовірно пишається вами!");
            }

            adviceList.innerHTML = advices.map(a => `<li>${a}</li>`).join('');
        }
    </script>
</body>
</html>
