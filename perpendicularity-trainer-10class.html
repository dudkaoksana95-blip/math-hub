<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна дошка: Перпендикулярність | Тренажер 10 клас</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .name-input {
            max-width: 400px;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: #f8fafc;
        }

        .name-input:focus {
            border-color: var(--accent-blue);
            background: white;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .quiz-screen {
            text-align: left;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .timer {
            color: var(--accent-red);
            font-weight: 600;
        }

        .static-progress-bar {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .task-counter {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .task-card-title {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .option-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
            background: #f8fafc;
        }

        .option-btn.selected {
            border-color: var(--accent-blue);
            background: #eff6ff;
            font-weight: 500;
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: #f0fdf4;
            color: #166534;
        }

        .option-btn.incorrect {
            border-color: var(--accent-red);
            background: #fef2f2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        .results-box {
            text-align: left;
            padding: 1rem 0;
        }

        .results-box h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .results-score {
            text-align: center;
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 1.5rem;
        }

        .recommendation-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .recommendation-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recommendation-card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <div class="welcome-screen" id="welcome-screen">
            <h1><i class="fa-solid fa-triangle-triangles" style="color: var(--accent-blue);"></i> Інтерактивна дошка: Перпендикулярність</h1>
            <p>Тема: Перпендикулярність прямої та площини (10 клас)</p>
            <div>
                <input type="text" id="student-input-name" class="name-input" placeholder="Введіть ваше ім'я та прізвище" autocomplete="off">
            </div>
            <div>
                <button class="btn-primary" onclick="startQuiz()">Розпочати тестування (30 хв)</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Дано прямокутник ABCD. Пряма SA ⊥ (ABC). Яка з прямих перпендикулярна до AB?",
                options: ["SB", "SA", "SD", "SC"],
                correct: 1
            },
            {
                question: "Якщо пряма перпендикулярна до двох площин, що перетинаються, то як розміщені ці площини?",
                options: ["Перпендикулярні", "Паралельні", "Збігаються", "Неможливо визначити"],
                correct: 1
            },
            {
                question: "З точки поза площиною проведено перпендикуляр і похилу. Довжина перпендикуляра 12 см, а похилої — 13 см. Знайдіть довжину проєкції похилої.",
                options: ["1 см", "5 см", "25 см", "√313 см"],
                correct: 1
            },
            {
                question: "Пряма а перпендикулярна до площини α. Скільки площин, перпендикулярних до прямої а, можна провести через точку А поза цією прямою?",
                options: ["Жодної", "Одну", "Безліч", "Дві"],
                correct: 1
            },
            {
                question: "Через вершину А прямого кута С трикутника ABC проведено перпендикуляр AK до площини трикутника. Чому дорівнює відстань від точки К до сторони BC?",
                options: ["АК", "АС", "КС", "АВ"],
                correct: 2
            },
            {
                question: "Якщо дві прямі, перпендикулярні до площини, різні, то вони:",
                options: ["Паралельні", "Мимобіжні", "Перетинаються", "Перпендикулярні"],
                correct: 0
            },
            {
                question: "Кінець похилої лежить на відстані 8 см від площини, а її проєкція дорівнює 6 см. Знайдіть довжину похилої.",
                options: ["14 см", "10 см", "2 см", "√28 см"],
                correct: 1
            },
            {
                question: "Площина α перпендикулярна до сторони АВ трикутника ABC. Яке взаємне розміщення площини α і сторони ВС, якщо АВ ⊥ ВС?",
                options: ["Паралельні", "Перпендикулярні", "Пряма лежить у площині", "Перетинаються під гострим кутом"],
                correct: 0
            },
            {
                question: "Яке з тверджень про перпендикуляр і похилу є хибним?",
                options: [
                    "Перпендикуляр коротший за похилу",
                    "Більшій похилій відповідає більша проєкція",
                    "Рівні похилі мають рівні проєкції",
                    "Довжина проєкції може дорівнювати довжині похилої"
                ],
                correct: 3
            },
            {
                question: "Сторона рівностороннього трикутника дорівнює 6 см. Точка поза площиною віддалена від кожної його вершини на 4 см. Знайдіть відстань від точки до площини трикутника.",
                options: ["1 см", "2 см", "√7 см", "2√3 см"],
                correct: 1
            },
            {
                question: "Якщо пряма паралельна площині, то відстані від точок прямої до площини:",
                options: ["Різні", "Дорівнюють нулю", "Однакові", "Збільшуються пропорційно"],
                correct: 2
            },
            {
                question: "З точки А до площини α проведено дві похилі, довжини яких відносяться як 5:6. Їх проєкції дорівнюють 7 см і 18 см. Знайдіть довжину меншої похилої.",
                options: ["10 см", "15 см", "20 см", "25 см"],
                correct: 1
            }
        ];

        let studentName = "";
        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswered = false;
        let timerInterval;
        let timeLeft = 1800; // 30 хвилин (30 * 60 секунд)

        function startQuiz() {
            const inputVal = document.getElementById('student-input-name').value.trim();
            if (!inputVal) {
                alert("Будь ласка, введіть ваше ім'я та прізвище!");
                return;
            }
            studentName = inputVal;

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="quiz-screen">
                    <div class="quiz-header">
                        <span id="student-display">Учень: ${studentName}</span>
                        <span>Залишилось: <span class="timer" id="timer">30:00</span></span>
                        <span>Бали: <span id="current-score">0</span> / 12</span>
                    </div>

                    <div class="static-progress-bar">
                        <span class="task-counter" id="progress-text">Завдання 1 з 12</span>
                        <i class="fa-solid fa-flag-checkered" style="color: var(--text-secondary);"></i>
                    </div>

                    <div id="quiz-body">
                        <div class="task-card-title" id="task-number-label">Завдання 1 з 12</div>
                        <div class="question-text" id="question-text"></div>
                        <div class="options-list" id="options-list"></div>
                        <div class="actions">
                            <button class="btn-primary" id="next-btn" onclick="handleNext()" style="display: none;">Далі</button>
                        </div>
                    </div>
                </div>
            `;

            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            isAnswered = false;
            selectedOption = null;
            document.getElementById('next-btn').style.display = 'none';

            const q = questions[currentIndex];
            document.getElementById('task-number-label').innerText = `Завдання ${currentIndex + 1} з 12`;
            document.getElementById('progress-text').innerText = `Завдання ${currentIndex + 1} з 12`;
            document.getElementById('question-text').innerText = q.question;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(idx, btnElement) {
            if (isAnswered) return;
            
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedOption = idx;

            document.getElementById('next-btn').style.display = 'block';
        }

        function handleNext() {
            if (selectedOption === null || isAnswered) return;
            isAnswered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, idx) => {
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedOption) {
                    btn.classList.add('incorrect');
                }
                btn.style.cursor = 'default';
            });

            if (selectedOption === q.correct) {
                score++;
                document.getElementById('current-score').innerText = score;
            }

            currentIndex++;
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = currentIndex < questions.length ? 'Наступне завдання' : 'Завершити тест';
            nextBtn.onclick = () => {
                if (currentIndex < questions.length) {
                    nextBtn.innerText = 'Далі';
                    nextBtn.onclick = handleNext;
                    loadQuestion();
                } else {
                    clearInterval(timerInterval);
                    showResults();
                }
            };
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showResults();
                    return;
                }
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                const timerEl = document.getElementById('timer');
                if (timerEl) {
                    timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        }

        function getRecommendation(score) {
            if (score === 12) {
                return "Чудовий результат! Ви повністю засвоїли тему «Перпендикулярність прямої та площини», упевнено володієте властивостями похилих і проєкцій. Продовжуйте в тому ж дусі!";
            } else if (score >= 9) {
                return "Дуже добрий результат! Ви непогано орієнтуєтеся в темі, проте зверніть увагу на складніші задачі на зв'язок між довжинами похилих та їхніми проєкціями.";
            } else if (score >= 5) {
                return "Задовільний результат. Рекомендуємо повторити теорему про три перпендикуляри, означення перпендикулярності прямої і площини, а також уважніше розв'язувати задачі на прямокутний трикутник у просторі.";
            } else {
                return "Тема засвоєна слабко. Варто уважно опрацювати теоретичний матеріал параграфа за підручником, розібрати базові приклади на перпендикуляр і похилу з учителем чи однокласниками та спробувати пройти тренажер знову.";
            }
        }

        function showResults() {
            const recommendationText = getRecommendation(score);
            document.getElementById('app-container').innerHTML = `
                <div class="results-box">
                    <h2>Тест завершено!</h2>
                    <p style="color: var(--text-secondary); text-align: center; margin-bottom: 0.5rem;">Учень: ${studentName}</p>
                    <div class="results-score">${score} / 12 балів</div>
                    
                    <div class="recommendation-card">
                        <h3><i class="fa-solid fa-lightbulb" style="color: #eab308;"></i> Рекомендації за результатами:</h3>
                        <p>${recommendationText}</p>
                    </div>

                    <button class="btn-primary" onclick="location.reload()" style="margin: 0 auto; display: block;">Пройти знову</button>
                </div>
            `;
        }
    </script>
</body>
</html>
