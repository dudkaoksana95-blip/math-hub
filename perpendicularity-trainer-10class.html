<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перпендикулярність прямої та площини | Тренажер 10 клас</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .timer {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* Статична панель без анімації */
        .static-progress-bar {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .task-counter {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .task-card-title {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .option-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
            background: #f8fafc;
        }

        .option-btn.selected {
            border-color: var(--accent-blue);
            background: #eff6ff;
            font-weight: 500;
        }

        .option-btn.correct {
            border-color: var(--accent-green);
            background: #f0fdf4;
            color: #166534;
        }

        .option-btn.incorrect {
            border-color: var(--accent-red);
            background: #fef2f2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background: var(--text-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background: #334155;
        }

        .results-box {
            text-align: center;
            padding: 2rem 0;
        }

        .results-box h2 {
            margin-bottom: 1rem;
            font-size: 1.75rem;
        }

        .results-score {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <div class="quiz-header">
            <span id="student-name">Учень: пп</span>
            <span>Залишилось: <span class="timer" id="timer">10:00</span></span>
            <span>Бали: <span id="current-score">0</span> / 12</span>
        </div>

        <!-- Статичний блок замість анімації -->
        <div class="static-progress-bar">
            <span class="task-counter" id="progress-text">Завдання 1 з 12</span>
            <i class="fa-solid fa-flag-checkered" style="color: var(--text-secondary);"></i>
        </div>

        <div id="quiz-body">
            <div class="task-card-title" id="task-number-label">Завдання 1 з 12</div>
            <div class="question-text" id="question-text">Завантаження завдання...</div>
            <div class="options-list" id="options-list"></div>
            <div class="actions">
                <button class="btn-next" id="next-btn" onclick="handleNext()" style="display: none;">Далі</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Дано прямокутник ABCD. Пряма SA ⊥ (ABC). Яка з прямих перпендикулярна до AB?",
                options: ["SB", "SA", "SD", "SC"],
                correct: 1
            },
            {
                question: "Якщо пряма перпендикулярна до двох площин, що перетинаються, то як розміщені ці площини?",
                options: ["Перпендикулярні", "Паралельні", "Збігаються", "Неможливо визначити"],
                correct: 1
            },
            {
                question: "З точки поза площиною проведено перпендикуляр і похилу. Довжина перпендикуляра 12 см, а похилої — 13 см. Знайдіть довжину проєкції похилої.",
                options: ["1 см", "5 см", "25 см", "√313 см"],
                correct: 1
            },
            {
                question: "Пряма а перпендикулярна до площини α. Скільки площин, перпендикулярних до прямої а, можна провести через точку А поза цією прямою?",
                options: ["Жодної", "Одну", "Безліч", "Дві"],
                correct: 1
            },
            {
                question: "Через вершину А прямого кута С трикутника ABC проведено перпендикуляр AK до площини трикутника. Чому дорівнює відстань від точки К до сторони BC?",
                options: ["АК", "АС", "КС", "АВ"],
                correct: 2
            },
            {
                question: "Якщо дві прямі, перпендикулярні до площини, різні, то вони:",
                options: ["Паралельні", "Мимобіжні", "Перетинаються", "Перпендикулярні"],
                correct: 0
            },
            {
                question: "Кінець похилої лежить на відстані 8 см від площини, а її проєкція дорівнює 6 см. Знайдіть довжину похилої.",
                options: ["14 см", "10 см", "2 см", "√28 см"],
                correct: 1
            },
            {
                question: "Площина α перпендикулярна до сторони АВ трикутника ABC. Яке взаємне розміщення площини α і сторони ВС, якщо АВ ⊥ ВС?",
                options: ["Паралельні", "Перпендикулярні", "Пряма лежить у площині", "Перетинаються під гострим кутом"],
                correct: 0
            },
            {
                question: "Яке з тверджень про перпендикуляр і похилу є хибним?",
                options: [
                    "Перпендикуляр коротший за похилу",
                    "Більшій похилій відповідає більша проєкція",
                    "Рівні похилі мають рівні проєкції",
                    "Довжина проєкції може дорівнювати довжині похилої"
                ],
                correct: 3
            },
            {
                question: "Сторона рівностороннього трикутника дорівнює 6 см. Точка поза площиною віддалена від кожної його вершини на 4 см. Знайдіть відстань від точки до площини трикутника.",
                options: ["1 см", "2 см", "√7 см", "2√3 см"],
                correct: 1
            },
            {
                question: "Якщо пряма паралельна площині, то відстані від точок прямої до площини:",
                options: ["Різні", "Дорівнюють нулю", "Однакові", "Збільшуються пропорційно"],
                correct: 2
            },
            {
                question: "З точки А до площини α проведено дві похилі, довжини яких відносяться як 5:6. Їх проєкції дорівнюють 7 см і 18 см. Знайдіть довжину меншої похилої.",
                options: ["10 см", "15 см", "20 см", "25 см"],
                correct: 1
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswered = false;

        function loadQuestion() {
            isAnswered = false;
            selectedOption = null;
            document.getElementById('next-btn').style.display = 'none';

            const q = questions[currentIndex];
            document.getElementById('task-number-label').innerText = `Завдання ${currentIndex + 1} з 12`;
            document.getElementById('progress-text').innerText = `Завдання ${currentIndex + 1} з 12`;
            document.getElementById('question-text').innerText = q.question;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(idx, btnElement) {
            if (isAnswered) return;
            
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedOption = idx;

            // Миттєва перевірка або після натискання — тут одразу фіксуємо вибір і показуємо "Далі"
            document.getElementById('next-btn').style.display = 'block';
        }

        function handleNext() {
            if (selectedOption === null || isAnswered) return;
            isAnswered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, idx) => {
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedOption) {
                    btn.classList.add('incorrect');
                }
                btn.style.cursor = 'default';
            });

            if (selectedOption === q.correct) {
                score++;
                document.getElementById('current-score').innerText = score;
            }

            currentIndex++;
            document.getElementById('next-btn').innerText = currentIndex < questions.length ? 'Наступне завдання' : 'Завершити тест';
            document.getElementById('next-btn').onclick = () => {
                if (currentIndex < questions.length) {
                    document.getElementById('next-btn').innerText = 'Далі';
                    document.getElementById('next-btn').onclick = handleNext;
                    loadQuestion();
                } else {
                    showResults();
                }
            };
        }

        function showResults() {
            document.getElementById('app-container').innerHTML = `
                <div class="results-box">
                    <h2>Тест завершено!</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 1rem;">Результат учня (пп)</p>
                    <div class="results-score">${score} / 12 балів</div>
                    <p style="margin-bottom: 2rem;">Дякуємо за проходження тренажера з геометрії.</p>
                    <button class="btn-next" onclick="location.reload()" style="margin: 0 auto; display: block;">Пройти знову</button>
                </div>
            `;
        }

        // Таймер (простий зворотний відлік на 10 хвилин)
        let timeLeft = 600;
        const timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showResults();
                return;
            }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);

        loadQuestion();
    </script>
</body>
</html>
